name: Build
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - jruby-9.4
          - jruby-10
          - truffleruby
          - "4.0"
          - "3.4"
          - "3.3"
          - "3.2"
          - "3.1"
        rails:
          - "7.0"
          - "7.1"
          - "7.2"
          - "8.0"
          - "8.1"
          - main
        exclude:
          # activerecord-jdbcsqlite3-adapter has no release for Rails >= 8.0
          - { ruby: jruby-9.4, rails: "8.0" }
          - { ruby: jruby-9.4, rails: "8.1" }
          - { ruby: jruby-9.4, rails: main }
          - { ruby: jruby-10, rails: "8.0" }
          - { ruby: jruby-10, rails: "8.1" }
          - { ruby: jruby-10, rails: main }
          # Rails >= 8.0 requires Ruby 3.2
          - { ruby: "3.1", rails: "8.0" }
          - { ruby: "3.1", rails: "8.1" }
          # Rails main (8.2) requires Ruby 3.3
          - { ruby: "3.1", rails: main }
          - { ruby: "3.2", rails: main }

    runs-on: 'ubuntu-latest'

    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.rails }}.gemfile

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Setup project
        run: bundle install
      - name: Run test
        run: bundle exec rake all_specs

  standard:
    name: Run standard
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
      - name: Setup project
        run: bundle install
      - name: Run test
        run: bundle exec rake standard
